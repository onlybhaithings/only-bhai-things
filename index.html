<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONLY BHAI THINGS BY MUSTAKIN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 30px 15px 22px;
  border-bottom: 1px solid #222;
}

.brand {
  margin: 0;
  line-height: 1.1;
}

.brand span {
  display: block;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #bdbdbd;
}

.brand strong {
  display: block;
  margin-top: 6px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
}

.subtitle {
  color: #999;
  margin: 12px 0 0;
  font-size: 14px;
}

/* CATEGORY BUTTONS */
.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 18px 12px;
  justify-content: center;
}

.categories button {
  background: #202126;
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 10px 17px;
  white-space: nowrap;
  font-weight: bold;
  cursor: pointer;
}

.categories button:hover {
  background: #33343a;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: #17181c;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #292a2e;
}

.card img {
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  display: block;
}

.info {
  padding: 10px;
}

.title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 9px;
  word-break: break-word;
}

.download {
  display: block;
  width: 100%;
  text-align: center;
  background: #ed0712;
  color: white;
  text-decoration: none;
  padding: 10px;
  border-radius: 7px;
  font-weight: bold;
  font-size: 13px;
}

.download:hover {
  background: #ff1822;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #aaa;
}

/* FOOTER */
footer {
  text-align: center;
  color: #777;
  padding: 45px 10px;
  font-size: 13px;
}

/* DESKTOP */
@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* MOBILE */
@media (max-width: 500px) {

  header {
    padding: 27px 10px 20px;
  }

  .brand span {
    font-size: 13px;
    letter-spacing: 1.5px;
  }

  .brand strong {
    font-size: 29px;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 13px;
  }

  .categories {
    justify-content: flex-start;
  }
}
</style>
</head>

<body>

<header>

  <h1 class="brand">
    <span>ONLY BHAI THINGS BY</span>
    <strong>MUSTAKIN</strong>
  </h1>

  <p class="subtitle">
    HD Wallpapers • Images • More
  </p>

</header>

<div class="categories">

  <button onclick="showAll()">All</button>
  <button onclick="filterWallpapers('4k')">4K</button>
  <button onclick="filterWallpapers('bollywood')">Bollywood</button>
  <button onclick="filterWallpapers('attitude')">Attitude</button>
  <button onclick="filterWallpapers('hd')">HD</button>

</div>

<div id="gallery" class="gallery">

  <div class="loading">
    Loading wallpapers...
  </div>

</div>

<footer>
  © 2026 ONLY BHAI THINGS BY MUSTAKIN
</footer>

<script>

const USERNAME = "onlybhaithings";
const REPOSITORY = "only-bhai-things";
const FOLDER = "wallpapers";

let allWallpapers = [];

/* LOAD WALLPAPERS FROM GITHUB */

async function loadWallpapers() {

  const gallery = document.getElementById("gallery");

  try {

    const api =
      `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/${FOLDER}`;

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("Could not load wallpapers");
    }

    const files = await response.json();

    allWallpapers = files.filter(file =>
      file.type === "file" &&
      /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
    );

    displayWallpapers(allWallpapers);

  } catch (error) {

    gallery.innerHTML = `
      <div class="loading">
        Wallpapers load nahi ho paaye 😕<br>
        Thodi der baad refresh karo.
      </div>
    `;

  }

}

/* DISPLAY WALLPAPERS */

function displayWallpapers(files) {

  const gallery = document.getElementById("gallery");

  if (files.length === 0) {

    gallery.innerHTML = `
      <div class="loading">
        Abhi koi wallpaper nahi hai 📸
      </div>
    `;

    return;
  }

  gallery.innerHTML = "";

  [...files].reverse().forEach(file => {

    const imageURL =
      `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/main/${FOLDER}/${encodeURIComponent(file.name)}`;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img
        src="${imageURL}"
        alt="${file.name}"
        loading="lazy"
      >

      <div class="info">

        <div class="title">
          ${file.name.replace(/\.[^/.]+$/, "")}
        </div>

        <a
          class="download"
          href="${imageURL}"
          download
          target="_blank"
        >
          Download
        </a>

      </div>
    `;

    gallery.appendChild(card);

  });

}

/* ALL */

function showAll() {
  displayWallpapers(allWallpapers);
}

/* FILTER */

function filterWallpapers(keyword) {

  const filtered = allWallpapers.filter(file =>
    file.name.toLowerCase().includes(keyword.toLowerCase())
  );

  displayWallpapers(filtered);
}

/* START */

loadWallpapers();

</script>

</body>
</html>
