<style>

/* =====================================
   RESET
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================
   BODY
===================================== */

body {

    background: #050505;

    color: #ffffff;

    font-family: Arial, sans-serif;

}


/* =====================================
   HEADER
===================================== */

header {

    text-align: center;

    padding: 32px 15px 25px;

    border-bottom: 1px solid #222;

}


.small-title {

    font-size: 12px;

    letter-spacing: 3px;

    font-weight: 600;

    color: #aaa;

    margin-bottom: 8px;

}


.main-title {

    font-size: 29px;

    font-weight: 900;

    letter-spacing: 2px;

}


/* =====================================
   INSTAGRAM
===================================== */

.instagram {

    text-align: center;

    padding: 15px 10px 5px;

}


.instagram a {

    display: inline-block;

    color: #aaa;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;

    border: 1px solid #292a2e;

    background: #151619;

    padding: 9px 18px;

    border-radius: 20px;

}


.instagram a:hover {

    color: white;

    background: #202126;

}


/* =====================================
   MENU
===================================== */

.menu {

    display: flex;

    justify-content: center;

    gap: 12px;

    padding: 20px 10px;

}


.menu button {

    border: none;

    background: #202126;

    color: white;

    padding: 11px 25px;

    border-radius: 30px;

    font-weight: bold;

    cursor: pointer;

}


.menu button.active {

    background: white;

    color: black;

}


/* =====================================
   GALLERY
===================================== */

.gallery {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 10px 15px 35px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

}


/* =====================================
   CARD
===================================== */

.card {

    background: #17181c;

    border-radius: 15px;

    overflow: hidden;

    border: 1px solid #292a2e;

}


/* =====================================
   IMAGE
===================================== */

.card-image {

    width: 100%;

    aspect-ratio: 9 / 16;

    overflow: hidden;

    background: #111;

}


.card-image img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

}


/* =====================================
   CARD INFO
===================================== */

.card-info {

    padding: 12px;

}


.card-title {

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 10px;

    line-height: 1.3;

}


/* =====================================
   DOWNLOAD BUTTON
===================================== */

.download {

    width: 100%;

    border: none;

    background: #f10b16;

    color: white;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;

}


.download:hover {

    background: #ff1823;

}


/* =====================================
   PREMIUM IMAGE
===================================== */

.premium-image {

    position: relative;

    width: 100%;

    aspect-ratio: 9 / 16;

    overflow: hidden;

}


.premium-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    filter: blur(8px);

    transform: scale(1.07);

}


/* =====================================
   PREMIUM LOCK
===================================== */

.lock {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        rgba(0,0,0,0.40);

}


.lock-icon {

    font-size: 43px;

    margin-bottom: 8px;

}


.premium-text {

    font-size: 13px;

    font-weight: 900;

}


/* =====================================
   PREMIUM BUTTON
===================================== */

.unlock {

    width: 100%;

    border: none;

    background: #ffb000;

    color: #000;

    padding: 12px;

    border-radius: 8px;

    font-weight: 900;

    cursor: pointer;

}


.unlock:hover {

    background: #ffc226;

}


/* =====================================
   HIDDEN
===================================== */

.hidden {

    display: none !important;

}


/* =====================================
   PAYMENT MODAL
===================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.92);

    z-index: 9999;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


.modal-box {

    background: #17181c;

    width: 100%;

    max-width: 390px;

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 18px;

    text-align: center;

    border: 1px solid #333;

}


.modal-box h2 {

    font-size: 20px;

    margin-bottom: 12px;

}


.price {

    color: #ffb000;

    font-size: 21px;

    font-weight: 900;

    margin: 12px 0;

}


.modal-box p {

    color: #aaa;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 15px;

}


/* =====================================
   SCANNER
===================================== */

.scanner {

    width: 100%;

    max-width: 280px;

    display: block;

    margin: 15px auto;

    border-radius: 12px;

}


/* =====================================
   CLOSE
===================================== */

.close {

    width: 100%;

    border: none;

    background: #333;

    color: white;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;

}


/* =====================================
   FOOTER
===================================== */

footer {

    text-align: center;

    color: #666;

    font-size: 12px;

    padding: 40px 10px;

}


.footer-instagram {

    display: inline-block;

    margin-top: 10px;

    color: #888;

    text-decoration: none;

}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 500px) {

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

        padding-left: 12px;

        padding-right: 12px;

    }


    .card-info {

        padding: 9px;

    }


    .card-title {

        font-size: 11px;

    }


    .download,
    .unlock {

        padding: 11px 5px;

        font-size: 11px;

    }


    .main-title {

        font-size: 26px;

    }


    .small-title {

        font-size: 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

    <div class="small-title">

        ONLY BHAI THINGS BY

    </div>


    <div class="main-title">

        MUSTAKIN

    </div>

</header>



<!-- =====================================
     INSTAGRAM
===================================== -->

<div class="instagram">

    <a
        href="https://www.instagram.com/onlybhaithings_/"
        target="_blank"
        rel="noopener noreferrer">

        📸 @onlybhaithings_ • FOLLOW

    </a>

</div>



<!-- =====================================
     FILTER BUTTONS
===================================== -->

<div class="menu">

    <button
        id="allBtn"
        class="active"
        onclick="showAll()">

        ALL

    </button>


    <button
        id="premiumBtn"
        onclick="showPremium()">

        PREMIUM

    </button>

</div>



<!-- =====================================
     GALLERY
===================================== -->

<div
    class="gallery"
    id="gallery">

</div>



<!-- =====================================
     PAYMENT MODAL
===================================== -->

<div
    class="modal"
    id="paymentModal">


    <div class="modal-box">


        <h2>

            🔒 PREMIUM WALLPAPER

        </h2>


        <div class="price">

            UNLOCK FOR ₹10 ONLY

        </div>


        <p>

            Premium wallpaper unlock karne ke liye
            ₹10 payment karein.

        </p>


        <img
            src="scanner.jpg"
            class="scanner"
            alt="₹10 Payment Scanner">


        <p>

            Scanner se ₹10 payment karein.

        </p>


        <button
            class="close"
            onclick="closePayment()">

            CLOSE

        </button>


    </div>

</div>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

    © 2026 ONLY BHAI THINGS BY MUSTAKIN


    <br>


    <a
        href="https://www.instagram.com/onlybhaithings_/"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-instagram">

        Instagram @onlybhaithings_

    </a>

</footer>



<script>

/* ==================================================
   WALLPAPER LIST

   PREMIUM = true
   FREE    = false

   IMPORTANT:
   Filenames yahan GitHub folder ke exact
   filenames ke according hain.
================================================== */


const wallpapers = [

    /* =========================
       PREMIUM
    ========================= */

    {
        name: "BHAI 4K PREMIUM",
        file: "BHAI-4K-premium.jpeg",
        premium: true
    },


    {
        name: "PREMIUM 🗿",
        file: "PREMIUM — 🗿 🔒.jpeg",
        premium: true
    },


    /* =========================
       FREE
    ========================= */

    {
        name: "90s Wallpaper",
        file: "90s_02.jpg",
        premium: false
    },


    {
        name: "KICK High Resolution",
        file: "KICK-HIGH-RESOLUTION.jpeg",
        premium: false
    },


    {
        name: "Premium But Free 💀",
        file: "PREMIUM-BUT-FREE-💀.jpeg",
        premium: false
    },


    {
        name: "Salman Khan 90s",
        file: "SALMAN-KHAN-90s-01.jpg",
        premium: false
    }

];



/* ==================================================
   CREATE GALLERY
================================================== */

function createGallery() {


    const gallery =
        document.getElementById("gallery");


    gallery.innerHTML = "";


    wallpapers.forEach(function(wallpaper) {


        const card =
            document.createElement("div");


        card.className =
            "card " +
            (wallpaper.premium
                ? "premium"
                : "free");


        /*
           encodeURI handles:
           spaces
           emoji
           special characters
        */

        const imagePath =
            "wallpapers/" +
            encodeURI(wallpaper.file);


        /* =================================
           PREMIUM CARD
        ================================= */

        if (wallpaper.premium) {


            card.innerHTML = `

                <div class="premium-image">

                    <img
                        src="${imagePath}"
                        alt="${wallpaper.name}">

                    <div class="lock">

                        <div class="lock-icon">
                            🔒
                        </div>

                        <div class="premium-text">
                            PREMIUM WALLPAPER
                        </div>

                    </div>

                </div>


                <div class="card-info">

                    <div class="card-title">
                        ${wallpaper.name}
                    </div>


                    <button
                        class="unlock"
                        onclick="openPayment()">

                        UNLOCK FOR PAY ₹10 ONLY

                    </button>

                </div>

            `;

        }


        /* =================================
           FREE CARD
        ================================= */

        else {


            card.innerHTML = `

                <div class="card-image">

                    <img
                        src="${imagePath}"
                        alt="${wallpaper.name}">

                </div>


                <div class="card-info">

                    <div class="card-title">
                        ${wallpaper.name}
                    </div>


                    <button
                        class="download"
                        onclick="downloadImage('${imagePath}', '${wallpaper.file}')">

                        DOWNLOAD

                    </button>

                </div>

            `;

        }


        gallery.appendChild(card);

    });

}



/* ==================================================
   SHOW ALL
================================================== */

function showAll() {


    document
        .querySelectorAll(".free")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .querySelectorAll(".premium")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .getElementById("allBtn")
        .classList.add("active");


    document
        .getElementById("premiumBtn")
        .classList.remove("active");

}



/* ==================================================
   SHOW PREMIUM
================================================== */

function showPremium() {


    document
        .querySelectorAll(".free")
        .forEach(function(card) {

            card.classList.add("hidden");

        });


    document
        .querySelectorAll(".premium")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .getElementById("premiumBtn")
        .classList.add("active");


    document
        .getElementById("allBtn")
        .classList.remove("active");

}



/* ==================================================
   DOWNLOAD FREE WALLPAPER
================================================== */

function downloadImage(imagePath, fileName) {


    const link =
        document.createElement("a");


    link.href = imagePath;


    link.download = fileName;


    link.target = "_blank";


    document
        .body
        .appendChild(link);


    link.click();


    document
        .body
        .removeChild(link);

}



/* ==================================================
   OPEN PAYMENT
================================================== */

function openPayment() {


    document
        .getElementById("paymentModal")
        .style.display = "flex";

}



/* ==================================================
   CLOSE PAYMENT
================================================== */

function closePayment() {


    document
        .getElementById("paymentModal")
        .style.display = "none";

}



/* ==================================================
   CLOSE MODAL BY CLICKING OUTSIDE
================================================== */

window.onclick = function(event) {


    const modal =
        document.getElementById(
            "paymentModal"
        );


    if (event.target === modal) {

        modal.style.display = "none";

    }

};



/* ==================================================
   START WEBSITE
================================================== */

createGallery();

</script>


</body>
