<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONLY BHAI THINGS BY MUSTAKIN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* HEADER */
header{
    text-align:center;
    padding:32px 15px 25px;
    border-bottom:1px solid #222;
}

.small-title{
    font-size:12px;
    letter-spacing:3px;
    color:#aaa;
    font-weight:600;
    margin-bottom:7px;
}

.main-title{
    font-size:30px;
    letter-spacing:2px;
    font-weight:900;
}

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:20px 10px;
}

.menu button{
    border:0;
    padding:11px 25px;
    border-radius:30px;
    background:#202126;
    color:#fff;
    font-weight:bold;
}

.menu button.active{
    background:#fff;
    color:#000;
}

/* GALLERY */
.gallery{
    max-width:1100px;
    margin:auto;
    padding:15px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.card{
    background:#17181c;
    border:1px solid #292a2e;
    border-radius:15px;
    overflow:hidden;
}

.card-image{
    width:100%;
    aspect-ratio:9/16;
    object-fit:cover;
    display:block;
}

.card-info{
    padding:12px;
}

.card-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.download{
    width:100%;
    border:0;
    background:#f10b16;
    color:#fff;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

/* PREMIUM */
.premium-photo{
    position:relative;
    overflow:hidden;
}

.premium-photo img{
    filter:blur(8px);
    transform:scale(1.06);
}

.lock{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,.35);
}

.lock-icon{
    font-size:45px;
}

.lock-text{
    margin-top:8px;
    font-size:13px;
    font-weight:bold;
}

.unlock{
    width:100%;
    border:0;
    background:#ffb000;
    color:#000;
    padding:12px;
    border-radius:8px;
    font-weight:900;
}

/* POPUP */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:999;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:#17181c;
    border:1px solid #333;
    border-radius:18px;
    padding:24px;
    text-align:center;
}

.modal-box h2{
    font-size:21px;
    margin-bottom:10px;
}

.price{
    color:#ffb000;
    font-size:20px;
    font-weight:900;
    margin:10px 0;
}

.modal-box p{
    color:#aaa;
    font-size:13px;
    margin:12px 0;
}

.scanner{
    width:100%;
    max-width:270px;
    background:#fff;
    border-radius:10px;
    display:block;
    margin:15px auto;
}

.close{
    width:100%;
    border:0;
    background:#333;
    color:#fff;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

/* HIDDEN */
.hidden{
    display:none!important;
}

/* FOOTER */
footer{
    text-align:center;
    color:#666;
    font-size:11px;
    padding:45px 10px;
}
</style>
</head>

<body>

<header>
    <div class="small-title">
        ONLY BHAI THINGS BY
    </div>

    <div class="main-title">
        MUSTAKIN
    </div>
</header>


<!-- ONLY TWO OPTIONS -->
<div class="menu">

    <button id="allBtn"
            class="active"
            onclick="showAll()">
        ALL
    </button>

    <button id="premiumBtn"
            onclick="showPremium()">
        PREMIUM
    </button>

</div>


<div class="gallery">

    <!-- FREE WALLPAPER -->
    <div class="card free">

        <img
            class="card-image"
            src="wallpapers/sal-man.jpeg"
            alt="Wallpaper">

        <div class="card-info">

            <div class="card-title">
                Salman Wallpaper
            </div>

            <button
                class="download"
                onclick="downloadImage('wallpapers/sal-man.jpeg')">
                DOWNLOAD
            </button>

        </div>

    </div>


    <!-- PREMIUM WALLPAPER -->
    <div class="card premium">

        <div class="premium-photo">

            <img
                class="card-image"
                src="wallpapers/sal-man.jpeg"
                alt="Premium Wallpaper">

            <div class="lock">

                <div class="lock-icon">
                    🔒
                </div>

                <div class="lock-text">
                    PREMIUM WALLPAPER
                </div>

            </div>

        </div>

        <div class="card-info">

            <div class="card-title">
                Premium Wallpaper
            </div>

            <button
                class="unlock"
                onclick="openPayment()">
                UNLOCK FOR ₹10 ONLY
            </button>

        </div>

    </div>

</div>


<!-- PAYMENT POPUP -->
<div class="modal" id="paymentModal">

    <div class="modal-box">

        <h2>
            🔒 PREMIUM WALLPAPER
        </h2>

        <div class="price">
            UNLOCK FOR ₹10 ONLY
        </div>

        <p>
            ₹10 pay karke premium wallpaper unlock karein.
        </p>

        <!-- SCANNER -->
        <img
            src="scanner.jpg"
            class="scanner"
            alt="Payment Scanner">

        <p>
            Scanner se ₹10 payment karein.
        </p>

        <button
            class="close"
            onclick="closePayment()">
            CLOSE
        </button>

    </div>

</div>


<footer>
    © 2026 ONLY BHAI THINGS BY MUSTAKIN
</footer>


<script>

function showAll(){

    document.querySelectorAll(".free")
    .forEach(function(card){
        card.classList.remove("hidden");
    });

    document.querySelectorAll(".premium")
    .forEach(function(card){
        card.classList.remove("hidden");
    });

    document.getElementById("allBtn")
    .classList.add("active");

    document.getElementById("premiumBtn")
    .classList.remove("active");
}


function showPremium(){

    document.querySelectorAll(".free")
    .forEach(function(card){
        card.classList.add("hidden");
    });

    document.querySelectorAll(".premium")
    .forEach(function(card){
        card.classList.remove("hidden");
    });

    document.getElementById("premiumBtn")
    .classList.add("active");

    document.getElementById("allBtn")
    .classList.remove("active");
}


function openPayment(){

    document.getElementById("paymentModal")
    .style.display="flex";
}


function closePayment(){

    document.getElementById("paymentModal")
    .style.display="none";
}


function downloadImage(image){

    const link=document.createElement("a");

    link.href=image;
    link.download="wallpaper";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

</script>

</body>
    </html>
