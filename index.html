<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONLY BHAI THINGS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 15px 20px;
  border-bottom: 1px solid #222;
}

header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 900;
}

header p {
  color: #999;
  margin: 8px 0 0;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 18px 12px;
  justify-content: center;
}

.categories button {
  background: #202126;
  color: white;
  border: 0;
  border-radius: 20px;
  padding: 10px 16px;
  white-space: nowrap;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: #17181c;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #292a2e;
}

.card img {
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  display: block;
}

.info {
  padding: 10px;
}

.title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 9px;
}

.download {
  display: block;
  width: 100%;
  text-align: center;
  background: #ed0712;
  color: white;
  text-decoration: none;
  padding: 10px;
  border-radius: 7px;
  font-weight: bold;
  font-size: 13px;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #aaa;
}

footer {
  text-align: center;
  color: #777;
  padding: 40px 10px;
  font-size: 13px;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>ONLY BHAI THINGS 🔥</h1>
  <p>HD Wallpapers • Images • More</p>
</header>

<div class="categories">
  <button onclick="showAll()">All</button>
  <button onclick="filterWallpapers('4k')">4K</button>
  <button onclick="filterWallpapers('bollywood')">Bollywood</button>
  <button onclick="filterWallpapers('attitude')">Attitude</button>
  <button onclick="filterWallpapers('hd')">HD</button>
</div>

<div id="gallery" class="gallery">
  <div class="loading">Loading wallpapers... 🔥</div>
</div>

<footer>
  © 2026 ONLY BHAI THINGS
</footer>

<script>

const USERNAME = "onlybhaithings";
const REPOSITORY = "only-bhai-things";
const FOLDER = "wallpapers";

let allWallpapers = [];

async function loadWallpapers() {

  const gallery = document.getElementById("gallery");

  try {

    const api =
      `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/${FOLDER}`;

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("Could not load wallpapers");
    }

    const files = await response.json();

    allWallpapers = files.filter(file =>
      file.type === "file" &&
      /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
    );

    displayWallpapers(allWallpapers);

  } catch (error) {

    gallery.innerHTML =
      `<div class="loading">
        Wallpapers load nahi ho paaye 😕<br>
        Thodi der baad refresh karo.
      </div>`;

  }
}

function displayWallpapers(files) {

  const gallery = document.getElementById("gallery");

  if (files.length === 0) {

    gallery.innerHTML =
      `<div class="loading">
        Abhi koi wallpaper nahi hai 📸
      </div>`;

    return;
  }

  gallery.innerHTML = "";

  files.reverse().forEach(file => {

    const imageURL =
      `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/main/${FOLDER}/${encodeURIComponent(file.name)}`;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img
        src="${imageURL}"
        alt="${file.name}"
        loading="lazy"
      >

      <div class="info">

        <div class="title">
          ${file.name.replace(/\.[^/.]+$/, "")}
        </div>

        <a
          class="download"
          href="${imageURL}"
          download
          target="_blank"
        >
          Download
        </a>

      </div>
    `;

    gallery.appendChild(card);

  });

}

function showAll() {
  displayWallpapers(allWallpapers);
}

function filterWallpapers(keyword) {

  const filtered = allWallpapers.filter(file =>
    file.name.toLowerCase().includes(keyword.toLowerCase())
  );

  displayWallpapers(filtered);
}

loadWallpapers();

</script>

</body>
  </html>
