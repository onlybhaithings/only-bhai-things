<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONLY BHAI THINGS BY MUSTAKIN</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* HEADER */
header {
    text-align: center;
    padding: 35px 15px 25px;
    border-bottom: 1px solid #222;
}

.small-title {
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: 600;
    color: #aaa;
    margin-bottom: 8px;
}

.main-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 12px;
    color: #777;
    font-size: 13px;
}

/* BUTTONS */
.menu {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 10px;
}

.menu button {
    border: none;
    background: #202126;
    color: white;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
}

.menu button.active {
    background: #fff;
    color: #000;
}

/* WALLPAPER GRID */
.gallery {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.card {
    background: #17181c;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #292a2e;
}

.card img {
    width: 100%;
    display: block;
    aspect-ratio: 9 / 16;
    object-fit: cover;
}

/* FREE IMAGE */
.card-info {
    padding: 12px;
}

.card-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.download {
    width: 100%;
    border: none;
    background: #f10b16;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

/* PREMIUM */
.premium-image {
    position: relative;
}

.premium-image img {
    filter: blur(7px);
    transform: scale(1.04);
}

.lock {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,0.30);
}

.lock-icon {
    font-size: 45px;
    margin-bottom: 8px;
}

.premium-text {
    font-weight: bold;
    font-size: 14px;
}

.unlock {
    width: 100%;
    border: none;
    background: #ffb000;
    color: #000;
    padding: 12px;
    border-radius: 8px;
    font-weight: 900;
    cursor: pointer;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    background: #17181c;
    width: 100%;
    max-width: 400px;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    border: 1px solid #333;
}

.modal-box h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

.price {
    color: #ffb000;
    font-size: 20px;
    font-weight: 900;
    margin: 12px 0;
}

.modal-box p {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 18px;
}

.scanner {
    width: 100%;
    max-width: 280px;
    margin: 10px auto 18px;
    display: block;
    border-radius: 10px;
    background: white;
}

.close {
    width: 100%;
    border: none;
    background: #333;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

/* PREMIUM HIDE */
.hidden {
    display: none !important;
}

/* FOOTER */
footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 45px 10px;
}
</style>
</head>

<body>

<header>

    <div class="small-title">
        ONLY BHAI THINGS BY
    </div>

    <div class="main-title">
        MUSTAKIN
    </div>

</header>

<!-- ONLY TWO OPTIONS -->
<div class="menu">

    <button id="allBtn" class="active" onclick="showAll()">
        ALL
    </button>

    <button id="premiumBtn" onclick="showPremium()">
        PREMIUM
    </button>

</div>


<div class="gallery">

    <!-- FREE WALLPAPER -->
    <div class="card free">

        <img src="wallpapers/sal-man.jpeg" alt="Wallpaper">

        <div class="card-info">

            <div class="card-title">
                Salman Wallpaper
            </div>

            <button class="download"
                onclick="downloadImage('wallpapers/sal-man.jpeg')">
                DOWNLOAD
            </button>

        </div>

    </div>


    <!-- PREMIUM WALLPAPER -->
    <div class="card premium">

        <div class="premium-image">

            <img src="wallpapers/sal-man.jpeg" alt="Premium Wallpaper">

            <div class="lock">

                <div class="lock-icon">
                    🔒
                </div>

                <div class="premium-text">
                    PREMIUM WALLPAPER
                </div>

            </div>

        </div>

        <div class="card-info">

            <div class="card-title">
                Premium Wallpaper
            </div>

            <button class="unlock" onclick="openPayment()">
                UNLOCK FOR ₹10 ONLY
            </button>

        </div>

    </div>

</div>


<!-- PAYMENT POPUP -->
<div class="modal" id="paymentModal">

    <div class="modal-box">

        <h2>
            🔒 PREMIUM WALLPAPER
        </h2>

        <div class="price">
            UNLOCK FOR ₹10 ONLY
        </div>

        <p>
            ₹10 payment karne ke baad premium wallpaper unlock hoga.
        </p>

        <!-- YOUR SCANNER -->
        <img
            src="scanner.jpg"
            class="scanner"
            alt="Payment Scanner">

        <p>
            Scanner se ₹10 pay karein.
        </p>

        <button class="close" onclick="closePayment()">
            CLOSE
        </button>

    </div>

</div>


<footer>
    © 2026 ONLY BHAI THINGS BY MUSTAKIN
</footer>


<script>

/* SHOW ALL */
function showAll() {

    document.querySelectorAll(".free")
        .forEach(card => {
            card.classList.remove("hidden");
        });

    document.querySelectorAll(".premium")
        .forEach(card => {
            card.classList.remove("hidden");
        });

    document.getElementById("allBtn")
        .classList.add("active");

    document.getElementById("premiumBtn")
        .classList.remove("active");
}


/* SHOW PREMIUM ONLY */
function showPremium() {

    document.querySelectorAll(".free")
        .forEach(card => {
            card.classList.add("hidden");
        });

    document.querySelectorAll(".premium")
        .forEach(card => {
            card.classList.remove("hidden");
        });

    document.getElementById("premiumBtn")
        .classList.add("active");

    document.getElementById("allBtn")
        .classList.remove("active");
}


/* PAYMENT POPUP */
function openPayment() {

    document.getElementById("paymentModal")
        .style.display = "flex";
}


function closePayment() {

    document.getElementById("paymentModal")
        .style.display = "none";
}


/* DOWNLOAD */
function downloadImage(image) {

    const link = document.createElement("a");

    link.href = image;
    link.download = "";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

</script>

</body>
</html>
