    background: rgba(0,0,0,0.43);

.premium-text {

/* =================================================
   ESCAPE FILE NAME
================================================= */

function escapeFileName(fileName) {

    return fileName
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');

}


/* =================================================
   IMAGE ERROR
================================================= */

function imageError(image, fileName) {

    console.log(
        "Image not found:",
        fileName
    );

    image.style.display = "none";


    const parent =
        image.parentElement;


    parent.style.display = "flex";

    parent.style.alignItems =
        "center";

    parent.style.justifyContent =
        "center";

    parent.style.color =
        "#777";

    parent.innerHTML = `

                font-size:12px;
            ">

            Image not found

            <br><br>

            <b>${fileName}</b>

    `;

}
