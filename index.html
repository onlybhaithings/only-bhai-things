<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ONLY BHAI THINGS BY MUSTAKIN</title>

<meta name="google-site-verification"
      content="-g1X61DAQf-PStdyqIlJW6KJMhlKHXOGzeVlmHQwApw">

<meta name="description"
      content="ONLY BHAI THINGS BY MUSTAKIN - HD Wallpapers and Premium Wallpapers.">

<meta name="robots"
      content="index, follow">


<style>

/* =====================================
   RESET
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================
   BODY
===================================== */

body {
    background: #050505;
    color: #ffffff;
    font-family: Arial, sans-serif;
}


/* =====================================
   HEADER
===================================== */

header {
    text-align: center;
    padding: 32px 15px 25px;
    border-bottom: 1px solid #222;
}

.small-title {
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: 600;
    color: #aaa;
    margin-bottom: 8px;
}

.main-title {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 2px;
}


/* =====================================
   INSTAGRAM
===================================== */

.instagram {
    text-align: center;
    padding: 15px 10px 5px;
}

.instagram a {
    display: inline-block;
    color: #aaa;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid #292a2e;
    background: #151619;
    padding: 9px 18px;
    border-radius: 20px;
}

.instagram a:hover {
    color: white;
    background: #202126;
}


/* =====================================
   MENU
===================================== */

.menu {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 10px;
}

.menu button {
    border: none;
    background: #202126;
    color: white;
    padding: 11px 25px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
}

.menu button.active {
    background: white;
    color: black;
}


/* =====================================
   GALLERY
===================================== */

.gallery {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 10px 15px 35px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}


/* =====================================
   CARD
===================================== */

.card {
    background: #17181c;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #292a2e;
}


/* =====================================
   FREE IMAGE
===================================== */

.card-image {
    width: 100%;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #111;
}

.card-image img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}


/* =====================================
   CARD INFO
===================================== */

.card-info {
    padding: 12px;
}

.card-title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
    line-height: 1.3;
}


/* =====================================
   FREE DOWNLOAD
===================================== */

.download {
    width: 100%;
    border: none;
    background: #f10b16;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.download:hover {
    background: #ff1823;
}


/* =====================================
   PREMIUM IMAGE
===================================== */

.premium-image {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    overflow: hidden;
}

.premium-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;

    filter: blur(8px);

    transform: scale(1.07);

    transition:
        filter 0.4s ease,
        transform 0.4s ease;
}


/* =====================================
   PREMIUM UNLOCKED
===================================== */

.premium-image.unlocked img {

    filter: none;

    transform: scale(1);

}


/* =====================================
   PREMIUM LOCK
===================================== */

.lock {
    position: absolute;
    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        rgba(0,0,0,0.40);

    transition:
        opacity 0.3s ease;
}


.lock-icon {
    font-size: 43px;
    margin-bottom: 8px;
}


.premium-text {
    font-size: 13px;
    font-weight: 900;
}


/* Hide lock after unlock */

.premium-image.unlocked .lock {

    opacity: 0;

    pointer-events: none;

}


/* =====================================
   PREMIUM BUTTON
===================================== */

.unlock {
    width: 100%;

    border: none;

    background: #ffb000;

    color: #000;

    padding: 12px;

    border-radius: 8px;

    font-weight: 900;

    cursor: pointer;
}


.unlock:hover {
    background: #ffc226;
}


/* =====================================
   PREMIUM DOWNLOAD
===================================== */

.premium-download {

    width: 100%;

    border: none;

    background: #f10b16;

    color: white;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;

    display: none;
}


.premium-download:hover {

    background: #ff1823;

}


/* =====================================
   HIDDEN
===================================== */

.hidden {
    display: none !important;
}


/* =====================================
   FOLLOW MODAL
===================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.92);

    z-index: 9999;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


.modal-box {

    background: #17181c;

    width: 100%;

    max-width: 390px;

    padding: 28px 24px;

    border-radius: 18px;

    text-align: center;

    border: 1px solid #333;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.7);
}


.modal-box h2 {

    font-size: 21px;

    margin-bottom: 14px;

}


.follow-price {

    color: #ffb000;

    font-size: 20px;

    font-weight: 900;

    margin: 10px 0 15px;

}


.modal-box p {

    color: #aaa;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 18px;

}


/* =====================================
   FOLLOW BUTTON
===================================== */

.follow-button {

    display: block;

    width: 100%;

    border: none;

    background: #ffb000;

    color: #000;

    padding: 14px;

    border-radius: 9px;

    font-size: 13px;

    font-weight: 900;

    text-decoration: none;

    margin-bottom: 10px;

    cursor: pointer;
}


.follow-button:hover {

    background: #ffc226;

}


/* =====================================
   VERIFY BUTTON
===================================== */

.verify-follow {

    width: 100%;

    border: none;

    background: #25262b;

    color: white;

    padding: 13px;

    border-radius: 9px;

    font-size: 13px;

    font-weight: 900;

    cursor: pointer;

    margin-bottom: 10px;
}


.verify-follow:hover {

    background: #33343a;

}


/* =====================================
   CLOSE
===================================== */

.close {

    width: 100%;

    border: none;

    background: transparent;

    color: #777;

    padding: 10px;

    font-weight: bold;

    cursor: pointer;
}


.close:hover {

    color: white;

}


/* =====================================
   FOOTER
===================================== */

footer {

    text-align: center;

    color: #666;

    font-size: 12px;

    padding: 40px 10px;

}


.footer-instagram {

    display: inline-block;

    margin-top: 10px;

    color: #888;

    text-decoration: none;

}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 500px) {

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

        padding-left: 12px;

        padding-right: 12px;

    }


    .card-info {

        padding: 9px;

    }


    .card-title {

        font-size: 11px;

    }


    .download,
    .unlock,
    .premium-download {

        padding: 11px 5px;

        font-size: 11px;

    }


    .main-title {

        font-size: 26px;

    }


    .small-title {

        font-size: 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

    <div class="small-title">
        ONLY BHAI THINGS BY
    </div>

    <div class="main-title">
        MUSTAKIN
    </div>

</header>


<!-- =====================================
     INSTAGRAM
===================================== -->

<div class="instagram">

    <a
        href="https://www.instagram.com/onlybhaithings_/"
        target="_blank"
        rel="noopener noreferrer">

        📸 @onlybhaithings_ • FOLLOW

    </a>

</div>


<!-- =====================================
     MENU
===================================== -->

<div class="menu">

    <button
        id="allBtn"
        class="active"
        onclick="showAll()">

        ALL

    </button>


    <button
        id="premiumBtn"
        onclick="showPremium()">

        PREMIUM

    </button>

</div>


<!-- =====================================
     GALLERY
===================================== -->

<div
    class="gallery"
    id="gallery">
</div>


<!-- =====================================
     FOLLOW MODAL
===================================== -->

<div
    class="modal"
    id="followModal">


    <div class="modal-box">


        <h2>
            🔒 PREMIUM WALLPAPER
        </h2>


        <div class="follow-price">
            FOLLOW TO UNLOCK
        </div>


        <p>

            Premium wallpaper unlock karne ke liye
            pehle hamare Instagram profile ko Follow karein.

        </p>


        <!-- INSTAGRAM -->

        <a
            class="follow-button"
            href="https://www.instagram.com/onlybhaithings_/"
            target="_blank"
            rel="noopener noreferrer">

            📸 FOLLOW @onlybhaithings_

        </a>


        <!-- UNLOCK -->

        <button
            class="verify-follow"
            onclick="unlockPremium()">

            ✅ I FOLLOWED — UNLOCK

        </button>


        <button
            class="close"
            onclick="closeFollow()">

            CLOSE

        </button>


    </div>

</div>


<!-- =====================================
     FOOTER
===================================== -->

<footer>

    © 2026 ONLY BHAI THINGS BY MUSTAKIN

    <br>

    <a
        href="https://www.instagram.com/onlybhaithings_/"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-instagram">

        Instagram @onlybhaithings_

    </a>

</footer>


<script>


/* ==================================================
   INSTAGRAM PROFILE
================================================== */

const instagramProfile =
    "https://www.instagram.com/onlybhaithings_/";


/* ==================================================
   PREMIUM UNLOCK STATUS
================================================== */

/*
   localStorage use kiya gaya hai.

   Ek baar user unlock karega,
   browser us device par unlock status
   remember karega.
*/

let premiumUnlocked =
    localStorage.getItem("premiumUnlocked") === "true";


/* ==================================================
   WALLPAPER LIST
================================================== */

const wallpapers = [

    /* =========================
       PREMIUM
    ========================= */

    {
        name: "BHAI 4K PREMIUM",
        file: "BHAI-4K-premium.jpeg",
        premium: true
    },


    {
        name: "PREMIUM 🗿",
        file: "PREMIUM — 🗿 🔒.jpeg",
        premium: true
    },


    /* =========================
       FREE
    ========================= */

    {
        name: "90s Wallpaper",
        file: "90s_02.jpg",
        premium: false
    },


    {
        name: "KICK High Resolution",
        file: "KICK-HIGH-RESOLUTION.jpeg",
        premium: false
    },


    {
        name: "Premium But Free 💀",
        file: "PREMIUM-BUT-FREE-💀.jpeg",
        premium: false
    },


    {
        name: "Salman Khan 90s",
        file: "SALMAN-KHAN-90s-01.jpg",
        premium: false
    }

];


/* ==================================================
   CREATE GALLERY
================================================== */

function createGallery() {

    const gallery =
        document.getElementById("gallery");


    gallery.innerHTML = "";


    wallpapers.forEach(function(wallpaper, index) {


        const card =
            document.createElement("div");


        card.className =
            "card " +
            (wallpaper.premium
                ? "premium"
                : "free");


        const imagePath =
            "wallpapers/" +
            encodeURI(wallpaper.file);


        /* =================================
           PREMIUM
        ================================= */

        if (wallpaper.premium) {


            const unlockedClass =
                premiumUnlocked
                    ? "unlocked"
                    : "";


            const buttonHTML =
                premiumUnlocked

                ?

                `
                <button
                    class="premium-download"
                    style="display:block;"
                    onclick="downloadImage('${imagePath}', '${wallpaper.file}')">

                    DOWNLOAD PREMIUM

                </button>
                `

                :

                `
                <button
                    class="unlock"
                    onclick="openFollow(${index})">

                    📸 FOLLOW TO UNLOCK

                </button>
                `;


            card.innerHTML = `

                <div
                    class="premium-image ${unlockedClass}"
                    id="premiumImage${index}">

                    <img
                        src="${imagePath}"
                        alt="${wallpaper.name}">

                    <div class="lock">

                        <div class="lock-icon">
                            🔒
                        </div>

                        <div class="premium-text">
                            PREMIUM WALLPAPER
                        </div>

                    </div>

                </div>


                <div class="card-info">

                    <div class="card-title">
                        ${wallpaper.name}
                    </div>

                    ${buttonHTML}

                </div>

            `;

        }


        /* =================================
           FREE
        ================================= */

        else {


            card.innerHTML = `

                <div class="card-image">

                    <img
                        src="${imagePath}"
                        alt="${wallpaper.name}">

                </div>


                <div class="card-info">

                    <div class="card-title">
                        ${wallpaper.name}
                    </div>


                    <button
                        class="download"
                        onclick="downloadImage('${imagePath}', '${wallpaper.file}')">

                        DOWNLOAD

                    </button>

                </div>

            `;

        }


        gallery.appendChild(card);

    });

}


/* ==================================================
   CURRENT PREMIUM INDEX
================================================== */

let selectedPremium = null;


/* ==================================================
   OPEN FOLLOW MODAL
================================================== */

function openFollow(index) {

    selectedPremium = index;

    document
        .getElementById("followModal")
        .style.display = "flex";

}


/* ==================================================
   CLOSE FOLLOW MODAL
================================================== */

function closeFollow() {

    document
        .getElementById("followModal")
        .style.display = "none";

}


/* ==================================================
   UNLOCK PREMIUM
================================================== */

function unlockPremium() {


    /*
       IMPORTANT:

       GitHub Pages Instagram follow ko
       automatically verify nahi kar sakta.

       Ye button user ke confirmation par
       premium unlock karta hai.
    */


    premiumUnlocked = true;


    localStorage.setItem(
        "premiumUnlocked",
        "true"
    );


    closeFollow();


    createGallery();


    alert(
        "🎉 Premium Unlocked!\n\n" +
        "Ab dono premium wallpapers open aur download kar sakte hain."
    );

}


/* ==================================================
   DOWNLOAD IMAGE
================================================== */

function downloadImage(imagePath, fileName) {


    const link =
        document.createElement("a");


    link.href = imagePath;


    link.download = fileName;


    link.target = "_blank";


    document
        .body
        .appendChild(link);


    link.click();


    document
        .body
        .removeChild(link);

}


/* ==================================================
   SHOW ALL
================================================== */

function showAll() {


    document
        .querySelectorAll(".free")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .querySelectorAll(".premium")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .getElementById("allBtn")
        .classList.add("active");


    document
        .getElementById("premiumBtn")
        .classList.remove("active");

}


/* ==================================================
   SHOW PREMIUM
================================================== */

function showPremium() {


    document
        .querySelectorAll(".free")
        .forEach(function(card) {

            card.classList.add("hidden");

        });


    document
        .querySelectorAll(".premium")
        .forEach(function(card) {

            card.classList.remove("hidden");

        });


    document
        .getElementById("premiumBtn")
        .classList.add("active");


    document
        .getElementById("allBtn")
        .classList.remove("active");

}


/* ==================================================
   CLOSE MODAL OUTSIDE
================================================== */

window.onclick = function(event) {


    const modal =
        document.getElementById("followModal");


    if (event.target === modal) {

        closeFollow();

    }

};


/* ==================================================
   START
================================================== */

createGallery();

</script>


</body>

</html>
